site_name: Aconite
repo_url: https://github.com/nwxrichardson/aconite
repo_name: nwxrichardson/aconite
site_dir: ../_site 
markdown_extensions:
  - abbr
  - attr_list 
  - tables
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  
watch:
  - includes

theme:
  features:
    - content.tooltips
  name: material
  logo: assets/aconiteIcon.png
  favicon: assets/aconiteIcon.png
  palette: 

      # Palette toggle for dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Palette toggle for light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode